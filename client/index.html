<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Icon set, in preference order. Safari before 26 ignores SVG icon
         links and probes /favicon.ico at the site root, so the ICO is first
         and MUST exist; the PNG covers the same browsers via <link>. The
         adaptive SVG is declared last and wins where supported (Safari 26+,
         Chrome, Firefox). The ?v= parameters cache-bust the icon URLs:
         Safari keeps a per-host favicon cache that otherwise survives the
         icon files changing, so a URL change forces the stale entries to
         refresh (bump v with the release that changes the icons).
         apple-touch-icon is iOS/macOS "Add to Home Screen" + notifications. -->
    <link rel="icon" href="/favicon.ico?v=3.17.0" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3.17.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3.17.0" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3.17.0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f2e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1017" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- IBM Plex Sans is loaded for the About / Field Guide view only (see
         index.css `.about-view`): the editorial pages it is benchmarked
         against are set in it, and system-ui has no matching 700 display
         weight. The board itself stays on the system stack (DESIGN.md §9). -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Agent Kanban Board</title>
    <script>
      // Apply the saved theme mode (or OS preference, for 'auto' / no stored
      // key / a garbage value) before first paint so there is no flash of the
      // wrong theme in any of the three modes. Must match lib/theme.ts
      // parseStoredMode + resolveMode: only the exact literals 'light' and
      // 'dark' are explicit choices, everything else (including an explicit
      // 'auto') follows prefers-color-scheme.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          var metaTheme = document.querySelector('meta[name="theme-color"]')
          if (metaTheme) metaTheme.setAttribute('content', dark ? '#0c1017' : '#f6f2e8')
        } catch (e) {
          /* blocked storage: fall back to the OS preference */
          try {
            document.documentElement.classList.toggle(
              'dark',
              window.matchMedia('(prefers-color-scheme: dark)').matches,
            )
          } catch (e2) {}
        }
      })()
    </script>
  </head>
  <body class="bg-bg text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
