<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f2e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1017" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Agent Kanban Board</title>
    <script>
      // Apply the saved theme mode (or OS preference, for 'auto' / no stored
      // key / a garbage value) before first paint so there is no flash of the
      // wrong theme in any of the three modes. Must match lib/theme.ts
      // parseStoredMode + resolveMode: only the exact literals 'light' and
      // 'dark' are explicit choices, everything else (including an explicit
      // 'auto') follows prefers-color-scheme.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          var metaTheme = document.querySelector('meta[name="theme-color"]')
          if (metaTheme) metaTheme.setAttribute('content', dark ? '#0c1017' : '#f6f2e8')
        } catch (e) {
          /* blocked storage: fall back to the OS preference */
          try {
            document.documentElement.classList.toggle(
              'dark',
              window.matchMedia('(prefers-color-scheme: dark)').matches,
            )
          } catch (e2) {}
        }
      })()
    </script>
  </head>
  <body class="bg-bg text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
