name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-bump guard diffs against the base branch, so it needs the
          # full history. checkout defaults to depth 1, which would make the merge
          # base unreachable.
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Version Bump Guard
        # A user-visible change must bump the version. kanban.version.test.js only
        # asserts internal consistency, so it cannot see that nothing was bumped.
        # Runs before the install so a missing bump fails fast.
        run: ./scripts/check-version-bump.sh "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

      - name: Install Dependencies
        run: |
          npm --prefix server ci
          npm --prefix client ci

      - name: Security Checks
        run: make sec

      - name: Run Server Tests
        run: npm --prefix server test

      - name: Run Client Status Tests
        run: node scripts/test-client-status.js

      - name: Run Client Tests
        run: npm --prefix client test

      - name: Build Client
        run: npm --prefix client run build
