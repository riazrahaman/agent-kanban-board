name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-bump guard diffs against the base branch, so it needs the
          # full history. checkout defaults to depth 1, which would make the merge
          # base unreachable.
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Version Bump Guard
        # A user-visible change must bump the version. kanban.version.test.js only
        # asserts internal consistency, so it cannot see that nothing was bumped.
        # Runs before the install so a missing bump fails fast.
        run: ./scripts/check-version-bump.sh "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

      - name: Install Dependencies
        run: |
          npm --prefix server ci
          npm --prefix client ci

      - name: Audit Dependencies
        run: |
          npm --prefix server audit --audit-level=high
          npm --prefix client audit --audit-level=high

      - name: Security Checks
        run: make sec

      - name: Run Server Tests
        run: npm --prefix server test

      - name: Run Client Status Tests
        run: node scripts/test-client-status.js

      - name: Run Client Tests
        run: npm --prefix client test

      - name: Build Client
        run: npm --prefix client run build

      - name: Card Layout Guard
        # Runs on the 22.x leg only: the guard needs a global `WebSocket`, which
        # Node 20 does not provide. It is a browser-layout integration check —
        # Node-version independent — so once per push is the right coverage, and
        # the unit/server suites still run the full 20 + 22 matrix.
        if: matrix.node-version == '22.x'
        # Closes a real gap: the 2.3.8 release fixed a text overflow but silently
        # squashed long card ids into a 30px sliver (11 lines) because
        # `overflow-wrap:anywhere` lowers min-content size inside a flex row.
        # No class-name assertion or unit test can detect that — it is a layout
        # outcome. This drives a real headless Chrome over CDP and measures every
        # card's header row, failing if any card's header wrapped.
        #
        # It seeds its own worst-case fixture (the id that regressed, plus a
        # long unbreakable token) because an empty board would pass vacuously.
        run: |
          set -e
          mkdir -p /tmp/ci-layout
          node server/server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4000/api/health >/dev/null && break
            sleep 1
          done

          LONG_TOKEN='AOV_BUILD_PROGRESS/TEST_REPORT/HANDOVER/CLAUDE.md/CHANGELOG_SUMMARY_AND_NOTES'
          # Mutating endpoints require BOTH a token and a valid agent role — a
          # create with only the token returns "A valid agent role is required
          # for mutating operations" (verified against the real server).
          seed_id() {
            curl -sf -X POST http://127.0.0.1:4000/api/tasks \
              -H "x-api-token: $KANBAN_AUTH_TOKEN" \
              -H 'x-agent-id: ci-layout' -H 'x-agent-role: admin' \
              -H 'Content-Type: application/json' -d "$1" >/dev/null
          }
          seed_id "{\"id\":\"init-agent-investment-advisor\",\"title\":\"Init agent-investment-advisor\",\"description\":\"\",\"status\":\"BACKLOG\",\"priority\":\"high\",\"project\":\"layoutfixture\",\"round\":1}"
          seed_id "{\"id\":\"layout-worst-case-long-id\",\"title\":\"Title with $LONG_TOKEN embedded\",\"description\":\"Desc $LONG_TOKEN\",\"status\":\"BACKLOG\",\"priority\":\"high\",\"project\":\"layoutfixture\",\"round\":1}"
          seed_id "{\"id\":\"layout-short\",\"title\":\"Short title\",\"description\":\"\",\"status\":\"BACKLOG\",\"priority\":\"low\",\"project\":\"layoutfixture\",\"round\":1}"
          seed_id "{\"id\":\"layout-long-agent\",\"title\":\"Long agent id\",\"description\":\"\",\"status\":\"BACKLOG\",\"priority\":\"low\",\"project\":\"layoutfixture\",\"round\":1}"
          # Give one card a long agent id so the footer row is exercised too.
          curl -sf -X POST "http://127.0.0.1:4000/api/tasks/layout-long-agent/claim?project=layoutfixture" \
            -H "x-api-token: $KANBAN_AUTH_TOKEN" -H 'x-agent-id: ci-layout' -H 'x-agent-role: builder' \
            -H 'Content-Type: application/json' -d "{\"agent_id\":\"agent-${LONG_TOKEN:0:44}}\"}" >/dev/null || true

          # Fail loudly if the fixture did not land — otherwise the guard would
          # run against an empty board and pass vacuously.
          SEEDED=$(curl -sf "http://127.0.0.1:4000/api/tasks?project=layoutfixture" \
            -H "x-api-token: $KANBAN_AUTH_TOKEN" | grep -o '"id"' | wc -l)
          echo "layout fixture seeded: $SEEDED task(s)"
          if [ "$SEEDED" -lt 4 ]; then
            echo "::error::layout fixture did not seed (got $SEEDED of 4) — the guard would pass vacuously"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # Launch a headless Chrome for the guard. The binary name is not
          # guaranteed across runner images (`google-chrome`, `google-chrome-stable`,
          # `chromium`, `chromium-browser`), so resolve it rather than assuming.
          # A missing browser is treated as a SKIP (exit 0) with a loud warning,
          # not a failure: the layout guard must not block unrelated work on a
          # runner-image change, and the local gate still exercises it.
          CHROME_BIN=''
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then CHROME_BIN="$c"; break; fi
          done
          if [ -z "$CHROME_BIN" ]; then
            echo "::warning::no Chrome/Chromium found on this runner — skipping the card layout guard"
            kill $SERVER_PID 2>/dev/null || true
            exit 0
          fi
          echo "layout guard using: $CHROME_BIN"

          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9222 --remote-allow-origins='*' about:blank &
          CHROME_PID=$!
          READY=0
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:9222/json/version >/dev/null 2>&1; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "::warning::Chrome DevTools endpoint never came up — skipping the card layout guard"
            kill $CHROME_PID $SERVER_PID 2>/dev/null || true
            exit 0
          fi

          STATUS=0
          node scripts/check-card-layout.mjs "http://127.0.0.1:4000" 9222 || STATUS=$?

          # Browser smoke test: seeds its own worst-case fixture project (long
          # unicode title, an unbreakable long id, many log entries) and asserts
          # the board renders with no page overflow and zero uncaught errors.
          # Exit 2 is an environmental skip (no target) and must not fail CI;
          # only a rendered defect (exit 1) does.
          SMOKE=0
          node scripts/check-browser-smoke.mjs "http://127.0.0.1:4000" 9222 || SMOKE=$?
          if [ "$SMOKE" = "1" ]; then STATUS=1; fi

          kill $CHROME_PID $SERVER_PID 2>/dev/null || true
          exit $STATUS
        env:
          KANBAN_AUTH_TOKEN: ci-layout-token
          KANBAN_ADMIN_TOKEN: ci-layout-token
          KANBAN_REAP_ENABLED: 'false'
          KANBAN_DATA_DIR: /tmp/ci-layout
          KANBAN_DATA_FILE: /tmp/ci-layout/tasks.json
          KANBAN_STORAGE_BACKEND: json
          PORT: '4000'
